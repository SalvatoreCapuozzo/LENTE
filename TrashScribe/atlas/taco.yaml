    descriptors: {material: [metal], rigidity: flexible and deformable, optics: opaque, shape: a flat sheet,
                  surface: [metallic and reflective, crumpled or wrinkled], color: [gray or silver], size: hand-sized}
    prose: "a crumpled sheet of thin shiny aluminium foil"
    stream: plastic and metal packaging
