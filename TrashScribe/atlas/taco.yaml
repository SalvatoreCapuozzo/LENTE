# Atlas for the TACO taxonomy (60 categories, names exactly as in
# TACO data/annotations.json). Each entry DESCRIBES a class in the vocabulary of
# atlas/schema.yaml. Fields left out are unknown for that class: they are not
# supervised and they do not count when naming.
#
# `stream` is the collection stream used by the monitoring layer. Streams are
# municipality-specific: edit them here, no retraining involved.
#
# Adding a class = appending an entry. Values not present in schema.yaml are
# accepted: they are scored through the same text path at inference.

name: taco
