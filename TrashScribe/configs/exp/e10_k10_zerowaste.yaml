# E10 (17 Nov): how many labelled images of a new site does the 34 M edge model need to match or beat
# SAM 3 (848 M, zero-shot) there? The leave-one-out model for zerowaste (E3) is fine-tuned with 10 labelled
# zerowaste TRAIN images (seeded random subset, list written to the run folder) drawn for 25 % of the training
# samples, plus the four other datasets. Fixed short schedule, the LAST epoch is tested: validation holds
# only the four other datasets, so it cannot choose an epoch for the new site. Test: zerowaste test, real labels.
_base_: e3_lodo_zerowaste.yaml
run_name: e10_k10_zerowaste
train_datasets: [taco, uavvaste, mju, bepli, zerowaste]
val_datasets: [taco, uavvaste, mju, bepli]
test_datasets: [zerowaste]
train:
  init_from: runs/e3_lodo_zerowaste/best.pt
  subsample: {zerowaste: {n: 10, seed: 0}}
  dataset_share: {zerowaste: 0.25}
  epochs: 6
  select: last
