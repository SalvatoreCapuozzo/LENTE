# E9 (17 Nov): SAM 3 as an OFFLINE TEACHER at a new site. The leave-one-out model for taco (E3) is
# fine-tuned on the four labelled datasets plus the taco TRAIN images labelled by SAM 3
# (scripts/baseline_zeroshot.py --detector sam3 --tasks pseudo; the real labels are never used).
# Selection: the four validation sets plus the SAM 3-labelled taco val images. Test: taco test, real
# labels. Same rule and schedule as e9_sam3_{mju,uavvaste,bepli}.
_base_: e3_lodo_taco.yaml
run_name: e9_sam3_taco
extra_datasets:
  - name: taco_sam3
    type: masks
    ignore_value: 255
    splits:
      train: {images_dir: _pseudo/sam3/taco/train/images, masks_dir: _pseudo/sam3/taco/train/masks}
      val:   {images_dir: _pseudo/sam3/taco/val/images, masks_dir: _pseudo/sam3/taco/val/masks}
train_datasets: [zerowaste, uavvaste, mju, bepli, taco_sam3]
val_datasets: [zerowaste, uavvaste, mju, bepli, taco_sam3]
test_datasets: [taco]
train:
  init_from: runs/e3_lodo_taco/best.pt
  epochs: 12
  patience: 4
