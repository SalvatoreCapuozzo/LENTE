# TrashScribe base configuration. Experiments inherit with `_base_: ../base.yaml`
# and override only what changes; every value can also be overridden from the
# command line:  python scripts/train.py configs/x.yaml train.epochs=5 model.lora_rank=8
run_name: trashscribe_base
output_dir: runs
device: auto                 # auto -> cuda > mps > cpu
seed: 42

schema: atlas/schema.yaml
atlases: [atlas/taco.yaml, atlas/zerowaste.yaml, atlas/binary.yaml]
novel_atlases: [atlas/novel_field_classes.yaml]     # inference only (never trained)
text_model: openai/clip-vit-base-patch16
text_cache: runs/_cache/text_clip_b16.pt
strict_atlas: true           # every class of every dataset must be in an atlas

data_root: ~/data/waste      # relative dataset paths resolve against this
datasets_file: configs/datasets.example.yaml
train_datasets: null         # null = every dataset that has a train split
val_datasets: null           # null = same as train_datasets
test_datasets: null
holdout: []                  # atlas entries never seen in training (whole images dropped)

model:
  backbone: sam2
  sam_ckpt: facebook/sam2.1-hiera-tiny
  image_size: 1024
  adapter_dim: 64            # LENTE adapters (zero-init), 0 disables
  adapter_where: attn        # attn | mlp | both
  lora_rank: 0               # LoRA on qkv/proj, 0 disables
  lora_alpha: 16.0
  train_decoder: true
  train_patch_embed: false   # keep low-level filters pre-trained (domain generalisation)
  mixstyle_p: 0.5            # feature-statistics mixing after the patch embedding
  geometry: false            # depth-gated early guidance (needs depth maps)
  desc_hidden: 256
  text_rank: 128
  ring_cells: 3              # width of the context ring, in stride-8 cells
  adversary: true

train:
  epochs: 40
  epoch_size: 4000           # samples drawn per epoch by the balanced sampler
  batch_size: 8
  val_batch_size: 8
  num_workers: 8
  amp: true                  # bf16 on Ampere+ (RTX 30xx, Orin), fp16+scaler on older GPUs
  lr_heads: 3.0e-4
  lr_peft: 1.0e-4
  lr_decoder: 5.0e-5
  weight_decay: 1.0e-4
  warmup_steps: 300
  grad_clip: 1.0
  patience: 8
  val_every: 1
  dataset_alpha: 0.5         # P(dataset) ∝ N^alpha
  transplant_p: 0.5          # cross-dataset object transplant probability
  transplant_cross_only: true
  transplant: {max_objects: 6, scale: [0.6, 1.3], harmonize: 0.5, feather: 1.5}
  aug: {strength: 1.0, vflip: false}
  loss: {mask: 1.0, contour: 0.5, desc: 1.0, dense: 0.5, dense_pixels: 16, adv: 0.1, adv_grl: 1.0,
         pos_weight: 2.0}

eval:
  naming: {weights: {dap: 1.0, proto: 1.0, prose: 0.5}, conf_thr: 0.0, margin_thr: 0.0}
  n_perm: 2000
